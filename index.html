<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">

<title>سامانه پذیرش شتابدهنده — مرکز شتابدهی نوآوری</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --text:#1b2430; --muted:#64748b;
  --primary:#1e3a5f; --primary-dark:#152c49; --border:#e3e6ec;
  --shadow:0 4px 20px rgba(30,58,95,.07); --radius:14px;
  --good:#15803d; --warn:#b45309; --bad:#b91c1c; --info:#1d4ed8;
  --accent:#c9a227; --accent-dark:#a8841f;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Vazirmatn,sans-serif;background:var(--bg);color:var(--text);line-height:1.8}
.container{max-width:900px;margin:0 auto;padding:18px}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 0 16px;flex-wrap:wrap;gap:10px}
h1{font-size:1.2rem;color:var(--primary)}
.sub{color:var(--muted);font-size:.82rem}
.card{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:14px}
.card h2{font-size:1.02rem;color:var(--primary);margin-bottom:6px}
.hint{color:var(--muted);font-size:.85rem;margin-bottom:14px}
.field{margin-bottom:15px}
label{display:block;font-weight:600;font-size:.88rem;margin-bottom:6px}
textarea,input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=time],select{width:100%;padding:11px;border:1px solid var(--border);border-radius:10px;font-family:inherit;font-size:.9rem;background:var(--bg);color:var(--text)}
textarea{min-height:100px;resize:vertical}
.btn{padding:11px 20px;border:none;border-radius:10px;cursor:pointer;font-family:inherit;font-size:.9rem;font-weight:700}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-danger{background:transparent;border:1px solid var(--bad);color:var(--bad)}
.btn-info{background:var(--info);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:6px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:12px 22px;border-radius:99px;font-size:.85rem;z-index:2000;opacity:0;transition:opacity .25s,bottom .25s}
.toast.show{opacity:1;bottom:32px}
.hidden{display:none!important}

/* --- ورود --- */
#authScreen{max-width:400px;margin:60px auto}
.auth-tabs{display:flex;gap:8px;margin-bottom:16px}
.auth-tab{flex:1;padding:10px;border:1px solid var(--border);background:var(--card);border-radius:10px;cursor:pointer;font-family:inherit;font-weight:700;font-size:.88rem;color:var(--muted)}
.auth-tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}

/* --- گیمیفیکیشن --- */
.xp-wrap{background:var(--card);border-radius:14px;padding:10px 14px;box-shadow:var(--shadow);min-width:190px}
.xp-top{display:flex;justify-content:space-between;font-size:.76rem;color:var(--muted);margin-bottom:5px}
.xp-track{height:8px;background:var(--border);border-radius:99px;overflow:hidden}
.xp-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-dark));border-radius:99px;transition:width .5s ease}
.confetti-piece{position:fixed;top:-10px;width:8px;height:8px;border-radius:2px;pointer-events:none;z-index:3000;animation:confetti-fall 1.6s ease-out forwards}
@keyframes confetti-fall{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(540deg);opacity:0}}
.badge-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.badge-chip{font-size:.72rem;padding:4px 10px;border-radius:99px;background:rgba(201,162,39,.12);color:var(--accent-dark);font-weight:700;border:1px solid rgba(201,162,39,.3)}
.badge-chip.locked{background:var(--bg);color:var(--muted);border-color:var(--border)}

/* --- استپر --- */
.stepper{display:flex;justify-content:space-between;margin-bottom:14px;overflow-x:auto;gap:2px;padding:4px 2px}
.step-dot-wrap{display:flex;flex-direction:column;align-items:center;flex:1;min-width:52px;position:relative;cursor:pointer}
.step-dot-wrap:not(:last-child)::after{content:'';position:absolute;top:14px;right:50%;width:100%;height:2px;background:var(--border);z-index:0}
.step-dot-wrap.done:not(:last-child)::after{background:var(--good)}
.step-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;background:var(--card);border:2px solid var(--border);color:var(--muted);z-index:1;position:relative}
.step-dot-wrap.done .step-dot{background:var(--good);border-color:var(--good);color:#fff}
.step-dot-wrap.current .step-dot{background:var(--primary);border-color:var(--primary);color:#fff}
.step-dot-label{font-size:.6rem;text-align:center;margin-top:4px;color:var(--muted)}
.step-dot-wrap.current .step-dot-label{color:var(--primary);font-weight:700}
.progress-bar{height:7px;background:var(--border);border-radius:99px;overflow:hidden;margin-bottom:4px}
.progress-fill{height:100%;background:var(--primary);width:0;transition:width .4s}
.progress-label{text-align:center;color:var(--muted);font-size:.82rem;margin-bottom:16px}

/* --- AI --- */
.ai-help-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.ai-btn{background:rgba(30,58,95,.08);border:1px solid rgba(30,58,95,.3);color:var(--primary-dark);border-radius:8px;padding:6px 12px;font-size:.78rem;font-weight:700;cursor:pointer;font-family:inherit}
.ai-panel{display:none;background:var(--bg);border:1px dashed var(--primary);border-radius:10px;padding:14px;margin-top:8px;font-size:.85rem}
.ai-panel.open{display:block}
.mini-btn{font-size:.78rem;padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-family:inherit}
.mini-btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.ai-suggest-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

/* --- مدارک --- */
.doc-cat{border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.doc-cat-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.doc-cat-title{font-weight:700;font-size:.92rem}
.doc-cat-note{color:var(--muted);font-size:.76rem;margin-bottom:8px}
.doc-cat-badge{font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:99px}
.doc-cat-badge.complete{background:#dcfce7;color:#15803d}
.doc-cat-badge.partial{background:#fef3c7;color:#b45309}
.doc-cat-badge.empty{background:#f1f5f9;color:#64748b}
.doc-item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--border);font-size:.85rem;flex-wrap:wrap;gap:8px}
.doc-item:first-of-type{border-top:none}
.doc-item-name{flex:1;min-width:140px}
.upload-btn{background:var(--card);border:1px solid var(--primary);color:var(--primary);border-radius:8px;padding:6px 12px;font-size:.78rem;font-weight:700;cursor:pointer;font-family:inherit}
.uploaded-chip{display:flex;align-items:center;gap:8px;background:#dcfce7;color:#15803d;border-radius:8px;padding:6px 10px;font-size:.76rem;font-weight:600}
.uploaded-chip button{background:none;border:none;color:var(--bad);cursor:pointer;font-weight:700;padding:0}
.doc-format-hint{color:var(--muted);font-size:.72rem;margin-top:8px}
.file-error{color:var(--bad);font-size:.76rem;width:100%}

/* --- داشبورد کارشناس --- */
.spec-badge{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px 14px;font-size:.85rem;box-shadow:var(--shadow)}
.spec-avatar{width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat-card{background:var(--card);border-radius:14px;padding:14px;text-align:center;box-shadow:var(--shadow)}
.stat-num{font-size:1.4rem;font-weight:800;color:var(--primary)}
.stat-label{font-size:.72rem;color:var(--muted);margin-top:2px}
@media(max-width:640px){.stats-row{grid-template-columns:repeat(2,1fr)}}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filter-chip{background:var(--card);border:1px solid var(--border);border-radius:99px;padding:7px 14px;font-size:.8rem;cursor:pointer;color:var(--muted)}
.filter-chip.active{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
.search-box{margin-bottom:12px}
.q-card{background:var(--card);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);margin-bottom:12px;cursor:pointer;border:1px solid transparent}
.q-card:hover{border-color:var(--primary)}
.q-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.q-name{font-weight:700;font-size:1rem}
.q-domain{color:var(--muted);font-size:.8rem;margin-top:3px}
.status-pill{font-size:.7rem;font-weight:700;padding:4px 11px;border-radius:99px;white-space:nowrap}
.q-meta{display:flex;gap:14px;margin-top:10px;font-size:.76rem;color:var(--muted)}
.status-draft{background:#f1f5f9;color:#64748b}
.status-submitted{background:#e0e7ff;color:#4338ca}
.status-in_review{background:#fef3c7;color:#b45309}
.status-needs_revision{background:#fee2e2;color:#b91c1c}
.status-awaiting_receipt{background:#dbeafe;color:#1d4ed8}
.status-receipt_submitted{background:#fef9c3;color:#a16207}
.status-meeting_pending{background:#ede9fe;color:#6d28d9}
.status-meeting_scheduled{background:#cffafe;color:#0e7490}
.status-approved{background:#dcfce7;color:#15803d}
.status-rejected{background:#f1f5f9;color:#475569}
.back-btn{background:none;border:none;color:var(--primary);font-family:inherit;font-size:.9rem;font-weight:700;cursor:pointer;margin-bottom:14px;padding:0}
.journey-map{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;overflow-x:auto;gap:2px}
.journey-stage{display:flex;flex-direction:column;align-items:center;flex:1;min-width:64px;position:relative}
.journey-stage:not(:last-child)::after{content:'';position:absolute;top:15px;right:50%;width:100%;height:2px;background:var(--border);z-index:0}
.journey-stage.done:not(:last-child)::after{background:var(--good)}
.journey-dot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:700;background:var(--card);border:2px solid var(--border);color:var(--muted);z-index:1;position:relative}
.journey-stage.done .journey-dot{background:var(--good);border-color:var(--good);color:#fff}
.journey-stage.current .journey-dot{background:var(--primary);border-color:var(--primary);color:#fff}
.journey-name{font-size:.66rem;text-align:center;margin-top:5px;color:var(--muted)}
.journey-stage.current .journey-name{color:var(--primary);font-weight:700}
.acc{border-top:1px solid var(--border)}
.acc:first-child{border-top:none}
.acc-head{display:flex;justify-content:space-between;align-items:center;padding:13px 0;cursor:pointer;font-weight:700;font-size:.9rem}
.acc-head .chev{transition:transform .2s;color:var(--muted);font-size:.8rem}
.acc.open .chev{transform:rotate(180deg)}
.acc-body{display:none;padding-bottom:14px;font-size:.87rem}
.acc.open .acc-body{display:block}
.score-row{display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
.score-top{display:flex;justify-content:space-between;font-size:.85rem}
.score-val{color:var(--primary);font-weight:800}
input[type=range]{width:100%;accent-color:var(--primary)}
.gauge-row{display:flex;align-items:center;gap:20px;flex-wrap:wrap;justify-content:center;margin-bottom:6px}
.gauge-wrap{width:120px;position:relative}
.gauge-wrap svg{width:100%}
.gauge-bg{fill:none;stroke:var(--border);stroke-width:10}
.gauge-fill{fill:none;stroke:var(--primary);stroke-width:10;stroke-linecap:round;transform:rotate(-90deg);transform-origin:60px 60px;transition:stroke-dashoffset .5s ease}
.gauge-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gauge-num{font-size:1.6rem;font-weight:800}
.gauge-cat{font-size:.72rem;color:var(--muted)}
.action-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.stage-hint{background:rgba(30,58,95,.08);border:1px solid rgba(30,58,95,.25);border-radius:10px;padding:12px 14px;font-size:.85rem;color:var(--primary-dark);margin-bottom:14px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal-box{background:var(--card);border-radius:16px;padding:22px;max-width:400px;width:100%}
.done-screen{text-align:center;padding:40px 10px}
.done-check{width:70px;height:70px;border-radius:50%;background:var(--good);color:#fff;font-size:2rem;display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
.summary-banner{background:rgba(30,58,95,.08);border:1px solid rgba(30,58,95,.25);border-radius:10px;padding:14px;font-size:.85rem;color:var(--primary-dark);margin-bottom:16px}
.review-section{border-top:1px solid var(--border);padding:10px 0;font-size:.85rem}
.review-section:first-child{border-top:none}
.review-section h3{font-size:.86rem;color:var(--primary);margin-bottom:4px}
.empty{text-align:center;color:var(--muted);padding:40px 0;font-size:.9rem}
</style>
</head>

<div class="container">
  <div id="authScreen" class="card">
    <div class="auth-tabs">
      <div class="auth-tab active" id="tabLogin" onclick="setAuthMode('login')">ورود</div>

    <div class="field"><label>رمز عبور</label><input type="password" id="authPass"></div>

<script>
const supa = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let currentUser = null, currentProfile = null;
let authMode = 'login';

function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2400); }

function burstConfetti(){
  const colors=['#1e3a5f','#c9a227','#15803d','#1d4ed8','#64748b'];
  for(let i=0;i<30;i++){
    const el=document.createElement('div');
    el.className='confetti-piece';
    el.style.left=(Math.random()*100)+'vw';
    el.style.background=colors[i%colors.length];
    el.style.animationDelay=(Math.random()*.3)+'s';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),2100);
  }
}

// ---------------------------- AUTH ----------------------------
function setAuthMode(m){
  authMode = m;
  document.getElementById('tabLogin').classList.toggle('active', m==='login');
  document.getElementById('tabSignup').classList.toggle('active', m==='signup');
  document.getElementById('nameField').style.display = m==='signup' ? 'block' : 'none';
  document.getElementById('authTitle').textContent = m==='signup' ? 'ساخت حساب جدید' : 'ورود به سامانه';
  document.getElementById('authBtn').textContent = m==='signup' ? 'ثبت‌نام' : 'ورود';
}

async function doAuth(){
  const email = document.getElementById('authEmail').value.trim();
  const pass = document.getElementById('authPass').value;
  const name = document.getElementById('authName').value.trim();
  if(!email || !pass){ toast('ایمیل و رمز عبور را وارد کنید'); return; }
  try{
    if(authMode==='signup'){
      const {data, error} = await supa.auth.signUp({email, password:pass, options:{data:{full_name:name}}});
      if(error) throw error;
      toast('ثبت‌نام شد. اگر تایید ایمیل فعال باشد، ایمیل خود را بررسی کنید.');
      if(data.session) onAuthReady();
    } else {
      const {data, error} = await supa.auth.signInWithPassword({email, password:pass});
      if(error) throw error;
      onAuthReady();
    }
  } catch(e){ toast('خطا: ' + e.message); }
}

async function onAuthReady(){
  const {data:{user}} = await supa.auth.getUser();
  currentUser = user;
  const {data:profile, error} = await supa.from('profiles').select('*').eq('id', user.id).single();
  if(error){ toast('خطا در دریافت پروفایل: ' + error.message); return; }
  currentProfile = profile;
  document.getElementById('authScreen').classList.add('hidden');
  document.getElementById('appRoot').classList.remove('hidden');
  if(profile.role === 'specialist' || profile.role === 'admin'){ initSpecialistView(); }
  else { initApplicantView(); }
}

// بازیابی نشست فعال (رفرش صفحه)
supa.auth.getSession().then(({data:{session}})=>{ if(session) onAuthReady(); });

  {id:'08',name:'گزارش اقدامات قبلی و دستاوردها',items:['گزارش اقدامات و دستاوردها']},
  {id:'09',name:'وضعیت فعلی تیم‌های استارتاپی',items:['پیش‌شتابدهی','شتابدهی','خروج موفق'],optional:true,optionalNote:'فقط اگر چرخه قبلی برگزار کرده‌اید'},
  {id:'10',name:'فرم‌ها و آیین‌نامه‌ها',items:['آیین‌نامه‌های شتابدهنده','فرم‌های شتابدهنده']},

const MAX_FILE_SIZE = 10*1024*1024;
const ALLOWED_EXT = ['pdf','jpg','jpeg','png','doc','docx','xls','xlsx','zip'];
const STEPS = [{key:'basic',label:'اطلاعات پایه'},{key:'plan',label:'محتوای طرح'},{key:'docs',label:'مدارک'},{key:'review',label:'بازبینی و ارسال'}];

let aState = { step:0, applicationId:null, basic:{name:'',founded:'',domain:'فناوری اطلاعات و نرم‌افزار'}, sections:{}, docs:{}, lastLevel:0 };
DOC_CATEGORIES.forEach(c => aState.docs[c.id] = c.items.map(()=>null));

async function initApplicantView(){
  const root = document.getElementById('appRoot');
  root.innerHTML = `<header><div><h1>ثبت طرح شتابدهنده</h1><div class="sub">${currentProfile.full_name || currentUser.email}</div></div>
    <div class="xp-wrap"><div class="xp-top"><span id="xpLevelLabel">🔰 تازه‌کار</span><span id="xpNum">0 XP</span></div><div class="xp-track"><div class="xp-fill" id="xpFill" style="width:0%"></div></div>
    <div class="badge-row" id="badgeRow"></div></div></header>
    <div id="wizardWrap">
      <div class="stepper" id="stepper"></div>
      <div class="progress-bar"><div class="progress-fill" id="pfill"></div></div>
      <div class="progress-label" id="plabel"></div>
      <div id="stepBody"></div>
      <div class="nav"><button class="btn btn-ghost" id="prevBtn" onclick="prevStep()">مرحله قبل</button><button class="btn btn-primary" id="nextBtn" onclick="nextStep()">مرحله بعد</button></div>
    </div>

    <div id="doneScreen" class="done-screen hidden"><div class="done-check">✓</div><h2 style="color:var(--primary);margin-bottom:8px">طرح شما ثبت شد</h2><p style="color:var(--muted)">پرونده شما برای بررسی کارشناس مرکز ارسال شد. نتیجه از طریق ایمیل اطلاع‌رسانی می‌شود.</p></div>`;

  const {data:apps} = await supa.from('applications').select('*').eq('applicant_id', currentUser.id).order('created_at',{ascending:false}).limit(1);
  const app = apps && apps[0];
  if(!app){ renderWizard(); return; }
  aState.applicationId = app.id;
  aState.basic = {name:app.name, founded:app.founded_year||'', domain:app.domain||'فناوری اطلاعات و نرم‌افزار'};

  if(app.status==='draft' || app.status==='needs_revision'){
    const {data:sections} = await supa.from('plan_sections').select('*').eq('application_id', app.id);
    (sections||[]).forEach(s => aState.sections[s.section_key] = s.content);
    const {data:docs} = await supa.from('documents').select('*').eq('application_id', app.id);

    if(app.status==='needs_revision'){ document.querySelector('#wizardWrap').insertAdjacentHTML('afterbegin', `<div class="stage-hint" style="border-color:var(--bad);background:rgba(220,38,38,.06);color:var(--bad)">کارشناس درخواست اصلاح داده: ${app.specialist_note||''}</div>`); }

}

function showStatusScreen(app){
  document.getElementById('wizardWrap').classList.add('hidden');

  ls.innerHTML = `<div class="card"><h2>وضعیت پرونده: ${app.name}</h2><p class="hint">${labels[app.status]||app.status}</p>${app.specialist_note?`<div class="stage-hint">یادداشت کارشناس: ${app.specialist_note}</div>`:''}</div>`;

function showReceiptUpload(app){
  document.getElementById('wizardWrap').classList.add('hidden');
  const ls = document.getElementById('lockedScreen');
  ls.classList.remove('hidden');
  ls.innerHTML = `<div class="card"><h2>تایید اولیه دریافت شد ✅</h2>
    <p class="hint">لطفاً فیش واریزی را بارگذاری کنید تا مرحله بعد (هماهنگی جلسه/بازدید) فعال شود.</p>

    <button class="btn btn-primary" onclick="document.getElementById('receiptInput').click()">بارگذاری فیش واریزی</button>
    <div class="file-error" id="receiptErr" style="margin-top:8px"></div></div>`;
}
async function uploadReceipt(inputEl){
  const file = inputEl.files[0]; if(!file) return;
  const err = document.getElementById('receiptErr');
  const ext = file.name.split('.').pop().toLowerCase();
  if(!['pdf','jpg','jpeg','png'].includes(ext)){ err.textContent='فرمت مجاز: PDF یا تصویر'; return; }
  if(file.size > MAX_FILE_SIZE){ err.textContent='حجم فایل بیشتر از ۱۰ مگابایت است'; return; }
  const path = `${aState.applicationId}/11/0-${Date.now()}-${file.name}`;
  const {error:upErr} = await supa.storage.from('documents').upload(path, file);
  if(upErr){ toast('خطا در آپلود: ' + upErr.message); return; }
  await supa.from('documents').upsert({application_id:aState.applicationId, category_id:'11', item_index:0, item_name:'فیش واریزی', file_path:path, file_name:file.name, file_size:file.size, mime_type:file.type});
  await supa.from('applications').update({status:'receipt_submitted'}).eq('id', aState.applicationId);
  toast('فیش با موفقیت ارسال شد'); burstConfetti();
  initApplicantView();
}

function renderWizard(){
  document.getElementById('wizardWrap').classList.remove('hidden');
  renderStepper(); renderStepBody(); renderXP();
  document.getElementById('prevBtn').disabled = aState.step===0;
  document.getElementById('nextBtn').textContent = aState.step===STEPS.length-1 ? 'ارسال طرح برای بررسی' : 'مرحله بعد';
}
function renderStepper(){
  document.getElementById('stepper').innerHTML = STEPS.map((s,i)=>{
    const cls = i<aState.step?'done':(i===aState.step?'current':'');
    return `<div class="step-dot-wrap ${cls}" onclick="goStep(${i})"><div class="step-dot">${i<aState.step?'✓':i+1}</div><div class="step-dot-label">${s.label}</div></div>`;
  }).join('');
  document.getElementById('pfill').style.width = (aState.step/(STEPS.length-1)*100)+'%';
  document.getElementById('plabel').textContent = `مرحله ${aState.step+1} از ${STEPS.length} — ${STEPS[aState.step].label}`;
}
function goStep(i){ if(i<=aState.step){ aState.step=i; renderWizard(); } }

function computeXP(){
  let xp=0;
  if(aState.basic.name) xp+=15;
  PLAN_SECTIONS.forEach(s=>{ if((aState.sections[s.id]||'').trim()) xp+=10; });
  DOC_CATEGORIES.forEach(c=>{ if(!c.optional && aState.docs[c.id].every(v=>v)) xp+=5; });
  return xp;
}
function renderXP(){
  const xp = computeXP(); const maxXp = 15 + PLAN_SECTIONS.length*10 + DOC_CATEGORIES.filter(c=>!c.optional).length*5;
  const pct = Math.min(100, Math.round(xp/maxXp*100));
  let level=0, label='🔰 تازه‌کار';
  if(pct>=90){level=3;label='🥇 طلایی';} else if(pct>=60){level=2;label='🥈 نقره‌ای';} else if(pct>=25){level=1;label='🥉 برنزی';}
  document.getElementById('xpFill').style.width = pct+'%';
  document.getElementById('xpNum').textContent = xp+' / '+maxXp+' XP';
  document.getElementById('xpLevelLabel').textContent = label;
  document.getElementById('badgeRow').innerHTML = [
    ['basic', aState.basic.name, 'پروفایل'],
    ['plan', PLAN_SECTIONS.every(s=>(aState.sections[s.id]||'').trim()), 'طرح کامل'],
    ['docs', DOC_CATEGORIES.filter(c=>!c.optional).every(c=>aState.docs[c.id].every(v=>v)), 'مدارک کامل'],
  ].map(([k,ok,label])=>`<span class="badge-chip ${ok?'':'locked'}">${ok?'✓':'○'} ${label}</span>`).join('');
  if(level > aState.lastLevel){ aState.lastLevel = level; if(level>0){ burstConfetti(); toast('سطح شما ارتقا یافت: '+label+' 🎉'); } }
}

      <div class="field"><label>نام شتابدهنده</label><input type="text" id="f-name" value="${aState.basic.name}"></div>

    </div>`;
  } else if(aState.step===1){
    body.innerHTML = `<div class="summary-banner">هر بخش را با متن خودتان تکمیل کنید یا از «کمک هوش مصنوعی» پیش‌نویس بگیرید.</div>` +
      PLAN_SECTIONS.map(s=>`<div class="card">
        <div class="ai-help-row"><h2 style="margin-bottom:0">${s.title}</h2><button class="ai-btn" onclick="toggleAi('${s.id}')">✨ کمک هوش مصنوعی</button></div>
        <p class="hint">${s.hint}</p>

          <div class="ai-suggest-actions"><button class="mini-btn primary" onclick="generateDraft('${s.id}')" id="aiBtn-${s.id}">تولید پیش‌نویس</button><button class="mini-btn" onclick="toggleAi('${s.id}')">بستن</button></div>
        </div></div>`).join('');
  } else if(aState.step===2){
    body.innerHTML = `<div class="summary-banner">فرمت مجاز: PDF، تصویر، Word، Excel یا ZIP — حداکثر ۱۰ مگابایت برای هر مدرک. فیش واریزی بعد از تایید اولیه کارشناس درخواست می‌شود.</div>` +
      DOC_CATEGORIES.map(c=>{
        const vals = aState.docs[c.id];
        const ok = vals.filter(Boolean).length;
        const st = ok===0?'empty':(ok===vals.length?'complete':'partial');
        return `<div class="doc-cat"><div class="doc-cat-head"><span class="doc-cat-title">${c.name}</span><span class="doc-cat-badge ${st}">${ok}/${vals.length}${c.optional?' · اختیاری':''}</span></div>
        ${c.optionalNote?`<div class="doc-cat-note">${c.optionalNote}</div>`:''}
        ${c.items.map((it,i)=>{ const f=vals[i]; const inputId=`file-${c.id}-${i}`;
          return `<div class="doc-item"><div class="doc-item-name">${it}</div>
          <input type="file" id="${inputId}" style="display:none" onchange="handleFileSelect('${c.id}',${i},this)">
          ${f ? `<div class="uploaded-chip">📎 ${f.name} <button onclick="removeDoc('${c.id}',${i})">حذف</button></div>` : `<button class="upload-btn" onclick="document.getElementById('${inputId}').click()">بارگذاری فایل</button>`}
          <div class="file-error" id="err-${c.id}-${i}"></div></div>`; }).join('')}
        </div>`;
      }).join('');
  } else if(aState.step===3){
    body.innerHTML = `<div class="card"><h2>بازبینی نهایی</h2>
      <div class="review-section"><h3>اطلاعات پایه</h3><p>${aState.basic.name} · تأسیس ${aState.basic.founded||'—'} · ${aState.basic.domain}</p></div>
      ${PLAN_SECTIONS.map(s=>`<div class="review-section"><h3>${s.title}</h3><p>${(aState.sections[s.id]||'').trim()||'<span style="color:var(--bad)">تکمیل نشده</span>'}</p></div>`).join('')}
      <div class="review-section"><h3>مدارک</h3><p>${DOC_CATEGORIES.map(c=>{const v=aState.docs[c.id],ok=v.filter(Boolean).length; return `<span style="color:${ok===v.length?'var(--good)':(c.optional?'var(--muted)':'var(--bad)')}">${c.name}: ${ok}/${v.length}</span>`;}).join(' · ')}</p></div>
    </div>`;
  }
}

function onSectionInput(id, el){ aState.sections[id]=el.value; renderXP(); }
function toggleAi(id){ document.getElementById('ai-'+id).classList.toggle('open'); }

async function generateDraft(id){
  const s = PLAN_SECTIONS.find(x=>x.id===id);
  const btn = document.getElementById('aiBtn-'+id); btn.disabled=true; btn.textContent='در حال تولید...';
  try{
    const res = await fetch(N8N_WEBHOOK_URL, {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({action:'draft', sectionTitle:s.title, hint:s.hint, currentText: document.getElementById('sec-'+id).value})});
    const data = await res.json();
    const ta = document.getElementById('sec-'+id);
    ta.value = (ta.value ? ta.value+'\n\n' : '') + (data.draft || '');
    onSectionInput(id, ta);
    toggleAi(id); toast('پیش‌نویس اضافه شد؛ ویرایشش کنید');
  } catch(e){ toast('اتصال به دستیار هوش مصنوعی برقرار نشد'); }
  btn.disabled=false; btn.textContent='تولید پیش‌نویس';
}

async function handleFileSelect(catId, idx, inputEl){
  const file = inputEl.files[0]; if(!file) return;
  const errEl = document.getElementById(`err-${catId}-${idx}`);
  const ext = file.name.split('.').pop().toLowerCase();
  if(!ALLOWED_EXT.includes(ext)){ errEl.textContent='فرمت مجاز نیست.'; inputEl.value=''; return; }
  if(file.size > MAX_FILE_SIZE){ errEl.textContent='حجم بیشتر از ۱۰ مگابایت است.'; inputEl.value=''; return; }
  errEl.textContent = 'در حال آپلود...';
  if(!aState.applicationId){ await saveBasicInfo(); }
  const path = `${aState.applicationId}/${catId}/${idx}-${Date.now()}-${file.name}`;
  const {error:upErr} = await supa.storage.from('documents').upload(path, file);
  if(upErr){ errEl.textContent = 'خطای آپلود: '+upErr.message; return; }
  const {error:dbErr} = await supa.from('documents').upsert({application_id:aState.applicationId, category_id:catId, item_index:idx, item_name:DOC_CATEGORIES.find(c=>c.id===catId).items[idx], file_path:path, file_name:file.name, file_size:file.size, mime_type:file.type});
  if(dbErr){ errEl.textContent = 'خطای ثبت متادیتا: '+dbErr.message; return; }
  errEl.textContent='';
  aState.docs[catId][idx] = {name:file.name, size:file.size, path};
  renderStepBody(); renderXP(); toast('فایل بارگذاری شد');
}
async function removeDoc(catId, idx){
  const f = aState.docs[catId][idx];
  if(f && f.path){ await supa.storage.from('documents').remove([f.path]); await supa.from('documents').delete().eq('application_id',aState.applicationId).eq('category_id',catId).eq('item_index',idx); }
  aState.docs[catId][idx] = null; renderStepBody(); renderXP();
}

async function saveBasicInfo(){
  aState.basic.name = document.getElementById('f-name')?.value.trim() || aState.basic.name;
  aState.basic.founded = document.getElementById('f-founded')?.value.trim() || aState.basic.founded;
  aState.basic.domain = document.getElementById('f-domain')?.value || aState.basic.domain;
  if(aState.applicationId){
    await supa.from('applications').update({name:aState.basic.name, founded_year:aState.basic.founded||null, domain:aState.basic.domain}).eq('id', aState.applicationId);
  } else {
    const {data, error} = await supa.from('applications').insert({applicant_id:currentUser.id, name:aState.basic.name, founded_year:aState.basic.founded||null, domain:aState.basic.domain, status:'draft'}).select().single();
    if(error){ toast('خطا: '+error.message); return false; }
    aState.applicationId = data.id;
  }
  return true;
}

async function validateStep(){
  if(aState.step===0){
    aState.basic.name = document.getElementById('f-name').value.trim();
    if(!aState.basic.name){ toast('نام شتابدهنده را وارد کنید'); return false; }
    const ok = await saveBasicInfo(); renderXP(); return ok;
  }
  if(aState.step===1){
    const empty = PLAN_SECTIONS.filter(s=>!(aState.sections[s.id]||'').trim());
    if(empty.length){ toast('لطفاً همه بخش‌ها را تکمیل کنید ('+empty.length+' بخش باقی‌مانده)'); return false; }
    for(const s of PLAN_SECTIONS){ await supa.from('plan_sections').upsert({application_id:aState.applicationId, section_key:s.id, content:aState.sections[s.id]}); }
    return true;
  }
  if(aState.step===2){
    const missing = DOC_CATEGORIES.filter(c=>!c.optional && aState.docs[c.id].some(v=>!v));
    if(missing.length){ toast('مدارک ناقص: '+missing.map(c=>c.name).join('، ')); return false; }
    return true;
  }
  return true;
}
async function nextStep(){
  const ok = await validateStep(); if(!ok) return;
  if(aState.step < STEPS.length-1){ aState.step++; renderWizard(); window.scrollTo(0,0); }
  else { await submitPlan(); }
}
function prevStep(){ if(aState.step>0){ aState.step--; renderWizard(); window.scrollTo(0,0); } }
async function submitPlan(){
  await supa.from('applications').update({status:'submitted', submitted_at:new Date().toISOString()}).eq('id', aState.applicationId);
  document.getElementById('wizardWrap').classList.add('hidden');
  document.getElementById('doneScreen').classList.remove('hidden');
  burstConfetti();
}

  document.getElementById('statsRow').innerHTML = `
    <div class="stat-card"><div class="stat-num">${total}</div><div class="stat-label">کل پرونده‌ها</div></div>
    <div class="stat-card"><div class="stat-num">${pending}</div><div class="stat-label">در انتظار بررسی</div></div>
    <div class="stat-card"><div class="stat-num">${inProgress}</div><div class="stat-label">در جریان تأیید</div></div>
    <div class="stat-card"><div class="stat-num">${approved}</div><div class="stat-label">تایید نهایی</div></div>`;
}
function renderFilters(){
  const cats=[['all','همه'],['submitted','ارسال شده'],['in_review','در حال بررسی'],['needs_revision','نیاز به اصلاح'],['awaiting_receipt','در انتظار فیش'],['meeting_pending','آماده جلسه'],['approved','تایید شده']];
  document.getElementById('filterRow').innerHTML = cats.map(([k,l])=>`<div class="filter-chip ${sFilter===k?'active':''}" onclick="setFilter('${k}')">${l}</div>`).join('');
}
function setFilter(k){ sFilter=k; renderFilters(); renderQueue(); }
function renderQueue(){
  const q=(document.getElementById('searchBox')?.value||'').trim();
  let list = sApps.filter(a=> a.status!=='draft' && (sFilter==='all'||a.status===sFilter));
  if(q) list = list.filter(a=>a.name.includes(q));
  const el = document.getElementById('queueList');
  if(!list.length){ el.innerHTML='<div class="empty">پرونده‌ای یافت نشد.</div>'; return; }
  el.innerHTML = list.map(a=>`<div class="q-card" onclick="openDetail('${a.id}')">
    <div class="q-top"><div><div class="q-name">${a.name}</div><div class="q-domain">${a.domain||''}</div></div><span class="status-pill status-${a.status}">${STATUS_LABELS[a.status]}</span></div>
    <div class="q-meta"><span>📅 ${a.submitted_at ? new Date(a.submitted_at).toLocaleDateString('fa-IR') : '—'}</span></div></div>`).join('');
}

function journeyIndex(status){ const map={submitted:0,in_review:1,needs_revision:1,awaiting_receipt:2,receipt_submitted:3,meeting_pending:3,meeting_scheduled:4,approved:5,rejected:1}; return map[status]??0; }

async function openDetail(id){
  sCurrent = sApps.find(a=>a.id===id);
  const [{data:sections},{data:docs},{data:evals}] = await Promise.all([
    supa.from('plan_sections').select('*').eq('application_id',id),
    supa.from('documents').select('*').eq('application_id',id),
    supa.from('evaluations').select('*').eq('application_id',id),
  ]);
  sCurrent.sectionsMap = {}; (sections||[]).forEach(s=>sCurrent.sectionsMap[s.section_key]=s.content);
  sCurrent.docsList = docs||[];
  sCurrent.scoresMap = {}; (evals||[]).forEach(e=>sCurrent.scoresMap[e.category_id]=e.score);
  document.getElementById('queueView').classList.add('hidden');
  document.getElementById('detailView').classList.remove('hidden');
  renderDetail(); window.scrollTo(0,0);
}
function closeDetail(){ document.getElementById('detailView').classList.add('hidden'); document.getElementById('queueView').classList.remove('hidden'); loadApplications().then(()=>{renderStats();renderQueue();}); }

function weightedScore(){
  let sum=0, wsum=0;
  SCORE_CATS.forEach(c=>{ if(sCurrent.scoresMap[c.id]!==undefined){ sum+=sCurrent.scoresMap[c.id]*c.weight; wsum+=c.weight; } });
  return wsum ? Math.round(sum/wsum) : 0;
}

function renderDetail(){
  const a = sCurrent;
  const curIdx = journeyIndex(a.status);
  const dv = document.getElementById('detailView');
  dv.innerHTML = `<button class="back-btn" onclick="closeDetail()">← بازگشت به فهرست پرونده‌ها</button>
    <div class="card"><div class="q-top" style="margin-bottom:10px"><div><div class="q-name">${a.name}</div><div class="q-domain">${a.domain||''}</div></div><span class="status-pill status-${a.status}">${STATUS_LABELS[a.status]}</span></div>
    <div class="journey-map">${JOURNEY_STAGES.map((s,i)=>{let cls=i<curIdx?'done':(i===curIdx?'current':''); return `<div class="journey-stage ${cls}"><div class="journey-dot">${i<curIdx?'✓':i+1}</div><div class="journey-name">${JOURNEY_LABELS[s]}</div></div>`;}).join('')}</div></div>
    <div class="stage-hint" id="stageHint"></div>
    <div class="card"><h2>محتوای طرح ارسالی</h2><div id="sectionsAcc"></div></div>
    <div class="card"><h2>مدارک بارگذاری‌شده</h2><div id="docList"></div></div>
    <div class="card"><h2>امتیازدهی شاخص‌ها</h2>
      <div class="gauge-row"><div class="gauge-wrap"><svg viewBox="0 0 120 120"><circle class="gauge-bg" cx="60" cy="60" r="50"/><circle class="gauge-fill" id="gaugeFill" cx="60" cy="60" r="50" stroke-dasharray="314.159"/></svg><div class="gauge-center"><div class="gauge-num" id="gaugeNum">0</div><div class="gauge-cat" id="gaugeCat">—</div></div></div>
      <div style="flex:1;min-width:180px;color:var(--muted);font-size:.85rem">امتیاز وزن‌دار از ۹ شاخص محاسبه می‌شود.</div></div>
      <div id="scoreGrid"></div></div>
    <div class="card"><h2>یادداشت کارشناس</h2><textarea id="specNote">${a.specialist_note||''}</textarea></div>
    <div class="card"><h2>اقدامات</h2><div class="action-row" id="actionRow"></div></div>`;

  const hints = {submitted:'این پرونده هنوز بررسی نشده.',in_review:'در حال بررسی هستید. پس از امتیازدهی، تایید اولیه یا درخواست اصلاح کنید.',needs_revision:'درخواست اصلاح ارسال شده؛ منتظر ارسال مجدد.',awaiting_receipt:'تایید اولیه صادر شده؛ منتظر فیش واریزی.',receipt_submitted:'فیش بارگذاری شده؛ آن را بررسی و تایید کنید.',meeting_pending:'فیش تایید شد؛ جلسه/بازدید را هماهنگ کنید.',meeting_scheduled:'جلسه تنظیم شده؛ پس از برگزاری تصمیم نهایی را ثبت کنید.',approved:'این پرونده تایید نهایی شده است.',rejected:'این پرونده رد شده است.'};
  document.getElementById('stageHint').textContent = hints[a.status]||'';

  document.getElementById('sectionsAcc').innerHTML = PLAN_SECTIONS.map(s=>`<div class="acc" id="acc-${s.id}"><div class="acc-head" onclick="toggleAcc('${s.id}')"><span>${s.title}</span><span class="chev">▾</span></div><div class="acc-body"><p>${a.sectionsMap[s.id]||'—'}</p></div></div>`).join('');

  document.getElementById('docList').innerHTML = a.docsList.length ? a.docsList.map(d=>`<div class="doc-item"><div class="doc-item-name">📄 ${d.item_name} <span style="color:var(--muted);font-size:.75rem">(${(d.file_size/1024).toFixed(0)} KB)</span></div><span class="upload-btn" onclick="previewDoc('${d.file_path}')">مشاهده</span></div>`).join('') : '<p class="hint">هنوز مدرکی بارگذاری نشده.</p>';

  document.getElementById('scoreGrid').innerHTML = SCORE_CATS.map(c=>{ const v=a.scoresMap[c.id]??0;
    return `<div class="score-row"><div class="score-top"><span>${c.name} <span style="color:var(--muted);font-size:.75rem">(وزن ${c.weight}٪)</span></span><span class="score-val" id="val-${c.id}">${v}</span></div><input type="range" min="0" max="100" value="${v}" oninput="updateScore('${c.id}',this.value)"></div>`; }).join('');

  renderGauge(); renderActions();
}
function toggleAcc(id){ document.getElementById('acc-'+id).classList.toggle('open'); }
async function previewDoc(path){
  const {data, error} = await supa.storage.from('documents').createSignedUrl(path, 60);
  if(error){ toast('خطا در دریافت فایل: '+error.message); return; }
  window.open(data.signedUrl, '_blank');
}
async function updateScore(catId, val){
  sCurrent.scoresMap[catId] = Number(val);
  document.getElementById('val-'+catId).textContent = val;
  renderGauge();
  await supa.from('evaluations').upsert({application_id:sCurrent.id, category_id:catId, score:Number(val), evaluator_id:currentUser.id});
}
function renderGauge(){
  const score = weightedScore(); const off = 314.159*(1-score/100);
  document.getElementById('gaugeFill').style.strokeDashoffset = off;
  document.getElementById('gaugeNum').textContent = score;
  let cat='ضعیف', color=getComputedStyle(document.documentElement).getPropertyValue('--bad');
  if(score>=85){cat='عالی';color=getComputedStyle(document.documentElement).getPropertyValue('--good');}
  else if(score>=70){cat='خوب';color=getComputedStyle(document.documentElement).getPropertyValue('--primary');}
  else if(score>=50){cat='متوسط';color=getComputedStyle(document.documentElement).getPropertyValue('--warn');}
  document.getElementById('gaugeCat').textContent=cat; document.getElementById('gaugeFill').style.stroke=color;
}
function renderActions(){
  const a=sCurrent; let html='';
  if(a.status==='submitted'){ html+=`<button class="btn btn-primary" onclick="setStatus('in_review')">شروع بررسی</button>`; }
  else if(a.status==='in_review'){ html+=`<button class="btn btn-primary" onclick="approveInitial()">تایید اولیه و درخواست فیش</button><button class="btn btn-danger" onclick="requestRevision()">درخواست اصلاح</button><button class="btn btn-ghost" onclick="setStatus('rejected')">رد پرونده</button>`; }
  else if(a.status==='needs_revision'){ html+=`<span style="align-self:center;color:var(--muted);font-size:.85rem">در انتظار ارسال مجدد</span>`; }
  else if(a.status==='awaiting_receipt'){ html+=`<span style="align-self:center;color:var(--muted);font-size:.85rem">در انتظار بارگذاری فیش توسط شتابدهنده</span>`; }
  else if(a.status==='receipt_submitted'){ html+=`<button class="btn btn-primary" onclick="setStatus('meeting_pending')">تایید فیش</button><button class="btn btn-danger" onclick="requestRevision()">فیش نامعتبر است</button>`; }
  else if(a.status==='meeting_pending'){ html+=`<button class="btn btn-primary" onclick="openMeetingModal()">هماهنگی جلسه/بازدید</button>`; }
  else if(a.status==='meeting_scheduled'){ html+=`<button class="btn btn-primary" onclick="approveFinal()">ثبت تایید نهایی</button><button class="btn btn-danger" onclick="setStatus('rejected')">رد پرونده</button>`; }
  else if(a.status==='approved'){ html+=`<span style="align-self:center;color:var(--good);font-weight:700">✓ تایید نهایی شده</span>`; }
  else if(a.status==='rejected'){ html+=`<span style="align-self:center;color:var(--muted)">رد شده است</span>`; }
  document.getElementById('actionRow').innerHTML = html;
}
async function saveNote(){ const note=document.getElementById('specNote').value; await supa.from('applications').update({specialist_note:note}).eq('id',sCurrent.id); sCurrent.specialist_note=note; }
async function setStatus(s){ await saveNote(); await supa.from('applications').update({status:s}).eq('id',sCurrent.id); sCurrent.status=s; toast('وضعیت به «'+STATUS_LABELS[s]+'» تغییر یافت'); renderDetail(); }
async function approveInitial(){ await saveNote(); await supa.from('applications').update({status:'awaiting_receipt'}).eq('id',sCurrent.id); sCurrent.status='awaiting_receipt'; toast('تایید اولیه ثبت شد'); renderDetail(); }
async function requestRevision(){ const note=document.getElementById('specNote').value.trim(); if(!note){ toast('یادداشت موارد اصلاحی را بنویسید'); return; } await saveNote(); await supa.from('applications').update({status:'needs_revision'}).eq('id',sCurrent.id); sCurrent.status='needs_revision'; toast('درخواست اصلاح ارسال شد'); renderDetail(); }
async function approveFinal(){ await saveNote(); await supa.from('applications').update({status:'approved'}).eq('id',sCurrent.id); sCurrent.status='approved'; burstConfetti(); toast('پرونده تایید نهایی شد 🎉'); renderDetail(); }

function openMeetingModal(){
  document.body.insertAdjacentHTML('beforeend', `<div class="modal-overlay" id="meetingModal"><div class="modal-box"><h3 style="color:var(--primary);margin-bottom:14px">هماهنگی جلسه / بازدید</h3>
    <div class="field"><label>نوع جلسه</label><select id="meetType"><option value="site">بازدید حضوری از فضا</option><option value="online">جلسه آنلاین</option><option value="inperson">جلسه حضوری در مرکز</option></select></div>
    <div class="field"><label>تاریخ</label><input type="date" id="meetDate"></div>
    <div class="field"><label>ساعت</label><input type="time" id="meetTime"></div>
    <div class="field"><label>توضیحات/آدرس</label><textarea id="meetNote"></textarea></div>
    <div class="action-row"><button class="btn btn-primary" style="flex:1" onclick="confirmMeeting()">ثبت و اعلام</button><button class="btn btn-ghost" onclick="document.getElementById('meetingModal').remove()">انصراف</button></div></div></div>`);
}
async function confirmMeeting(){
  const type=document.getElementById('meetType').value, date=document.getElementById('meetDate').value, time=document.getElementById('meetTime').value, note=document.getElementById('meetNote').value;
  if(!date||!time){ toast('تاریخ و ساعت را مشخص کنید'); return; }
  await supa.from('meetings').insert({application_id:sCurrent.id, meeting_type:type, meeting_date:date, meeting_time:time, note, created_by:currentUser.id});
  await supa.from('applications').update({status:'meeting_scheduled'}).eq('id',sCurrent.id);
  sCurrent.status='meeting_scheduled';
  document.getElementById('meetingModal').remove(); toast('جلسه هماهنگ شد'); renderDetail();
}
</script>
</body>
</html>
